# Build and deploy the Nuxt site to GitHub Pages
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore Nuxt build cache
        uses: actions/cache@v4
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-nuxt-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-
      - name: Install dependencies
        run: npm ci
      # Nuxt 4 SPA static export. build:gh-pages sets DEPLOY_ENV=GH_PAGES which
      # makes nuxt.config.ts use the project base URL (/vue-car-racing/).
      # NOTE: do not use actions/configure-pages with static_site_generator:
      # nuxt here — it only understands Nuxt 2 configs, can't parse the .ts
      # config, and would inject a Nuxt 2 nuxt.config.js that disables ssr:false.
      - name: Static HTML export with Nuxt
        run: npm run build:gh-pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
